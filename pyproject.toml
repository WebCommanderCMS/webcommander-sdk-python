[build-system]
# 77 is the first release that supports the PEP 639 `license` string below.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webcommander"
version = "4.0.0"
description = "Python SDK for the WebCommander v4 REST API."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "WebCommander" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "webcommander",
    "ecommerce",
    "sdk",
    "rest",
    "api-client",
    "oauth2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # Do not lower: 2.32 carries the fix for CVE-2024-35195.
    "requests>=2.32.4",
    # Imported directly for multipart encoding; the floor matches requests.
    "urllib3>=1.21.1",
    "portalocker>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/WebCommanderCMS/webcommander-sdk-python"
Repository = "https://github.com/WebCommanderCMS/webcommander-sdk-python"
Issues = "https://github.com/WebCommanderCMS/webcommander-sdk-python/issues"

[project.optional-dependencies]
test = ["pytest>=8.0.0", "python-dotenv>=1.0.0"]
dev = [
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "pyrefly>=0.60.0",
    # Bounded: Ruff changes default rules and formatting between minor versions.
    "ruff>=0.14.6,<0.15",
]

# The same packages as the extras above, for `uv sync`; add a dev dependency to both.
[dependency-groups]
test = ["pytest>=8.0.0", "python-dotenv>=1.0.0"]
dev = [
    { include-group = "test" },
    "pyrefly>=0.60.0",
    "ruff>=0.14.6,<0.15",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["webcommander", "tests"]

[tool.setuptools.packages.find]
include = ["webcommander*"]

[tool.setuptools.package-data]
webcommander = ["py.typed"]

